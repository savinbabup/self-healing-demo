name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pytest

      - name: Run tests
        id: run_tests
        run: python calc.py
        continue-on-error: true

      - name: Capture test output on failure
        if: failure() && steps.run_tests.outcome == 'failure'
        id: capture_logs
        run: |
          echo "Test failed, capturing logs..."
          python calc.py 2>&1 | tee test_output.log || true
          echo "logs<<EOF" >> $GITHUB_OUTPUT
          cat test_output.log >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Trigger Self-Healing CI
        if: failure() && steps.run_tests.outcome == 'failure'
        run: |
          curl -X POST http://localhost:8080/api/v1/executions/webhook/company.ci/self-healing-ci-with-pr/ci-failure-webhook \
            -H "Content-Type: application/json" \
            -d '{
              "repository": "${{ github.repository }}",
              "job_name": "${{ github.job }}",
              "error_message": "Test execution failed in ${{ github.workflow }}",
              "error_logs": "${{ steps.capture_logs.outputs.logs }}",
              "github_token": "${{ secrets.SELF_HEALING_GITHUB_TOKEN }}",
              "create_pr": true
            }'

      - name: Notify on Self-Healing PR Creation
        if: failure() && steps.run_tests.outcome == 'failure'
        run: |
          echo "🤖 Self-Healing CI has been triggered!"
          echo "✅ An AI-powered PR will be created shortly with suggested fixes."
          echo "📍 Check: https://github.com/${{ github.repository }}/pulls"

      - name: Fail the job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1
