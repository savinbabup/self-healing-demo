name: CI & Self-Healing

on: [push, pull_request]

jobs:
  test-and-heal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 1️⃣ RUN TESTS AND CAPTURE LOGS
    - name: Run Tests & Capture Output
      id: run_tests
      run: |
        # Run pytest and save output to file (ignore failure for now with || true)
        pytest > test_logs.txt 2>&1 || true
        
        # Display logs in console
        cat test_logs.txt
        
        # Check for failure
        if grep -q "FAILED" test_logs.txt; then
          echo "❌ Tests failed! Preparing self-healing trigger..."
          echo "status=failure" >> $GITHUB_OUTPUT
        else
          echo "✅ Tests passed!"
          echo "status=success" >> $GITHUB_OUTPUT
        fi

    # 2️⃣ TRIGGER KESTRA (ONLY IF FAILED)
    - name: 🚨 Trigger AI Self-Healing
      if: steps.run_tests.outputs.status == 'failure'
      run: |
        # Clean logs for JSON payload (escape quotes and newlines)
        LOG_CONTENT=$(cat test_logs.txt | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g' | head -c 10000)
        
        echo "🔥 Triggering Kestra Self-Healing Agent..."
        
        # ✅ USES SECRETS - NO HARDCODED TOKENS
        curl -X POST "${{ secrets.KESTRA_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"repository\": \"${{ github.repository }}\",
            \"branch\": \"${{ github.ref_name }}\",
            \"job_name\": \"${{ github.job }}\",
            \"error_message\": \"CI Pipeline Failed on GitHub Actions\",
            \"error_logs\": \"$LOG_CONTENT\",
            \"commit_sha\": \"${{ github.sha }}\",
            \"github_token\": \"${{ secrets.SELF_HEALING_GITHUB_TOKEN }}\",
            \"gemini_api_key\": \"${{ secrets.GEMINI_API_KEY }}\"
          }"
          
        # Force the job to fail so the red 'X' appears in GitHub
        exit 1