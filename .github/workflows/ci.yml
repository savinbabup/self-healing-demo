name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pytest

      - name: Run tests
        id: run_tests
        run: |
          set -o pipefail
          python calc.py 2>&1 | tee test_output.log
        continue-on-error: true

      - name: Check if tests failed
        id: check_failure
        if: always()
        run: |
          if [ "${{ steps.run_tests.outcome }}" == "failure" ]; then
            echo "failed=true" >> $GITHUB_OUTPUT
            echo "✅ Test failed - will trigger self-healing"
          else
            echo "failed=false" >> $GITHUB_OUTPUT
            echo "✅ Tests passed"
          fi

      - name: Prepare logs for Self-Healing CI
        if: steps.check_failure.outputs.failed == 'true'
        id: prepare_logs
        run: |
          echo "Preparing error logs..."
          if [ -f test_output.log ]; then
            # Escape and format logs for JSON
            LOGS=$(cat test_output.log | jq -Rs .)
            echo "logs=$LOGS" >> $GITHUB_OUTPUT
          else
            echo 'logs="No logs available"' >> $GITHUB_OUTPUT
          fi

      - name: Trigger Self-Healing CI
        if: steps.check_failure.outputs.failed == 'true' && vars.KESTRA_URL != ''
        run: |
          echo "🚀 Triggering Self-Healing CI..."
          LOGS='${{ steps.prepare_logs.outputs.logs }}'
          curl -X POST ${{ vars.KESTRA_URL }}/api/v1/executions/webhook/company.ci/self-healing-ci-with-pr/ci-failure-webhook \
            -H "Content-Type: application/json" \
            -d "{
              \"repository\": \"${{ github.repository }}\",
              \"job_name\": \"${{ github.job }}\",
              \"error_message\": \"Test execution failed in ${{ github.workflow }}\",
              \"error_logs\": $LOGS,
              \"github_token\": \"${{ secrets.SELF_HEALING_GITHUB_TOKEN }}\",
              \"create_pr\": true
            }" || echo "⚠️ Failed to trigger Self-Healing CI (Kestra may be unreachable)"

      - name: Notify on Self-Healing status
        if: steps.check_failure.outputs.failed == 'true'
        run: |
          if [ -n "${{ vars.KESTRA_URL }}" ]; then
            echo "🤖 Self-Healing CI has been triggered!"
            echo "✅ An AI-powered PR will be created shortly with suggested fixes."
            echo "📍 Check: https://github.com/${{ github.repository }}/pulls"
          else
            echo "⚠️ Self-Healing CI is not configured (KESTRA_URL variable not set)"
            echo "💡 Set it in: Settings → Secrets and variables → Actions → Variables"
          fi

      - name: Fail the job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1
